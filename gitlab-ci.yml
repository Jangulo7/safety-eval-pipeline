# .gitlab-ci.yml
# GitLab CI/CD Configuration for LLM Evaluation Pipeline

image: python:3.11-slim

stages:
  - setup
  - test
  - quality
  - report

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "${PYTHONPATH}:${CI_PROJECT_DIR}/src"

# Cache dependencies between jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip
    - .venv/

# Install dependencies (runs once, cached for other jobs)
.install_deps: &install_deps
  before_script:
    - apt-get update -qq && apt-get install -y -qq git make
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install -r requirements-dev.txt

# Job: Install and verify environment
setup:
  stage: setup
  <<: *install_deps
  script:
    - python --version
    - pip --version
    - pip list
  artifacts:
    paths:
      - .venv/
    expire_in: 1 hour

# Job: Run all tests
test:
  stage: test
  <<: *install_deps
  dependencies:
    - setup
  script:
    - source .venv/bin/activate
    - export AWS_ACCESS_KEY_ID="test"
    - export AWS_SECRET_ACCESS_KEY="test"
    - export S3_MODEL_BUCKET="test-bucket"
    - make test
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    paths:
      - .coverage
    reports:
      junit: junit.xml
    expire_in: 1 week

# Job: Run tests with coverage
test-coverage:
  stage: test
  <<: *install_deps
  dependencies:
    - setup
  script:
    - source .venv/bin/activate
    - export AWS_ACCESS_KEY_ID="test"
    - export AWS_SECRET_ACCESS_KEY="test"
    - export S3_MODEL_BUCKET="test-bucket"
    - pytest tests/ --cov=src --cov-report=html --cov-report=term --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    paths:
      - htmlcov/
      - coverage.xml
      - .coverage
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

# Job: Code formatting check
format-check:
  stage: quality
  <<: *install_deps
  dependencies:
    - setup
  script:
    - source .venv/bin/activate
    - black --check src/ tests/ --line-length 100
    - isort --check-only src/ tests/ --profile black
  allow_failure: true

# Job: Linting with flake8
lint:
  stage: quality
  <<: *install_deps
  dependencies:
    - setup
  script:
    - source .venv/bin/activate
    - flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203,W503 --statistics
  allow_failure: false

# Job: Type checking with mypy
type-check:
  stage: quality
  <<: *install_deps
  dependencies:
    - setup
  script:
    - source .venv/bin/activate
    - mypy src/ --ignore-missing-imports --no-strict-optional --check-untyped-defs
  allow_failure: true

# Job: Security check (optional but recommended)
security-check:
  stage: quality
  <<: *install_deps
  dependencies:
    - setup
  script:
    - source .venv/bin/activate
    - pip install safety bandit
    - safety check --json || true
    - bandit -r src/ -f json -o bandit-report.json || true
  artifacts:
    when: always
    paths:
      - bandit-report.json
    expire_in: 1 week
  allow_failure: true

# Job: Generate coverage badge
coverage-badge:
  stage: report
  <<: *install_deps
  dependencies:
    - test-coverage
  script:
    - source .venv/bin/activate
    - pip install coverage-badge
    - coverage-badge -o coverage.svg -f
  artifacts:
    paths:
      - coverage.svg
    expire_in: 30 days
  only:
    - main
    - master

# Job: Deploy documentation (optional)
pages:
  stage: report
  dependencies:
    - test-coverage
  script:
    - mkdir -p public
    - cp -r htmlcov public/coverage
    - echo "<html><body><h1>LLM Eval Pipeline Reports</h1><ul><li><a href='coverage/'>Coverage Report</a></li></ul></body></html>" > public/index.html
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
    - main
    - master

# Optional: Run on merge requests
test-mr:
  stage: test
  <<: *install_deps
  script:
    - source .venv/bin/activate
    - export AWS_ACCESS_KEY_ID="test"
    - export AWS_SECRET_ACCESS_KEY="test"
    - export S3_MODEL_BUCKET="test-bucket"
    - make test
  only:
    - merge_requests
  except:
    - main
    - master
