# pyproject.toml - Modern Python project configuration

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-eval-pipeline"
version = "2.0.0"
description = "Automated safety benchmarking with a release gate: runs AISI Inspect safety tasks across providers, compares them, and fails the build on a threshold breach."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Johanna Angulo"}]
keywords = ["evals", "ai-safety", "inspect-ai", "benchmarking", "llm"]

[project.scripts]
safety-eval = "safety_eval.cli:main"

[project.urls]
Repository = "https://github.com/Jangulo7/safety-eval-pipeline"

[tool.setuptools.packages.find]
where = ["src"]
include = ["safety_eval*"]

[tool.setuptools.package-data]
safety_eval = ["reporting/templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # function call in default argument: intentional for Depends-style defaults
    "SIM108",  # ternaries are not always more readable than an if/else
    "RUF001",  # en-dashes, × and · are deliberate in user-facing strings and captions
    "RUF002",
    "RUF003",
    "RUF005",  # list concatenation reads better than unpacking when building table rows
    "UP042",   # str + Enum is intentional: it keeps enums JSON-serialisable in results.json
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F403", "F405"]
# The pre-Inspect watcher/collector modules and their tests are untouched by the harness
# swap. Re-styling them would bury the swap in unrelated diff noise, so the newer stylistic
# rules are not applied to them.
"src/tasks.py" = ["B904"]
"src/scheduler.py" = ["SIM102"]
"tests/test_tasks.py" = ["SIM117"]
"tests/test_collectors.py" = ["SIM117"]
"app/*" = ["E402"]                    # sys.path setup must precede the package imports

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` so the package imports without an editable install; `tests` so conftest_safety and
# the fixture factory resolve as top-level modules despite tests/ being a package.
pythonpath = ["src", "tests", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    "-v"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (hit a real provider; excluded from CI)",
    "slow: Tests that take more than 5 seconds",
    "harness: Exercise the installed inspect_ai / inspect_evals (no network, no provider)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
