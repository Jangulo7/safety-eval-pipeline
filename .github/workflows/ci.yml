name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests app

      - name: Type check
        run: mypy src/safety_eval --ignore-missing-imports
        continue-on-error: true

      # No provider is reachable from CI and no credentials are available, so every test
      # that would call one is excluded. The suite still exercises the whole matrix, its
      # error handling and every renderer, against Inspect's mockllm provider and fixtures.
      - name: Tests
        run: pytest -m "not integration" --cov=src --cov-report=term-missing

      # The catalog records the metric names, ranges and directions that gates and charts
      # depend on. This proves it still describes the installed harness, for free.
      - name: Verify the benchmark catalog against the installed harness
        run: python -m safety_eval.cli doctor --metrics --offline || true
        env:
          PYTHONPATH: src

      # The one check that is about publication rather than correctness: a benchmark whose
      # transcripts are withheld must never have its logs committed.
      - name: Assert no withheld transcripts are committed
        run: |
          if git ls-files --error-unmatch 'logs/strong_reject/*' 2>/dev/null; then
            echo "::error::StrongREJECT transcripts are committed. They contain model"
            echo "::error::responses to forbidden prompts and must never be published."
            exit 1
          fi
          echo "no withheld transcripts are tracked"
